<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de actividades · Presupuestos</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--tx:#222;--mut:#6b6b6b;--ln:#e3dfd6;--ok:#2e7d32;--okbg:#e7f3e8;--obs:#b26a00;--obsbg:#fff4e0;--acc:#7a5a3a}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 12px 8px}
  h1{font-size:17px;margin:0 0 6px}
  .barra{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--ok);width:0}
  .resumen{font-size:13px;color:var(--mut);margin:5px 0 7px}
  .fila{display:flex;gap:6px;flex-wrap:wrap}
  input[type=search]{flex:1 1 100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;font-size:15px;background:#fff}
  .filtros button,.acciones button{border:1px solid var(--ln);background:#fff;border-radius:16px;padding:5px 11px;font-size:13px;color:var(--tx)}
  .filtros button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  main{padding:8px 10px 90px;max-width:820px;margin:0 auto}
  details{background:var(--card);border:1px solid var(--ln);border-radius:10px;margin:8px 0}
  summary{list-style:none;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
  summary::-webkit-details-marker{display:none}
  summary .cnt{font-weight:400;font-size:13px;color:var(--mut);white-space:nowrap}
  summary .cnt.lista{color:var(--ok);font-weight:600}
  .cap-acc{padding:0 12px 6px;display:flex;justify-content:flex-end}
  .cap-acc button{border:none;background:none;color:var(--acc);font-size:13px;padding:2px 0}
  .item{border-top:1px solid var(--ln);padding:9px 12px}
  .item.ok{background:var(--okbg)}
  .item.conobs:not(.ok){background:var(--obsbg)}
  .top{display:flex;gap:10px;align-items:flex-start}
  .top input[type=checkbox]{width:24px;height:24px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--ok)}
  .nom{flex:1}
  .nom b{font-weight:500}
  .meta{font-size:12px;color:var(--mut);margin-top:2px}
  .cod{color:var(--acc);font-variant-numeric:tabular-nums;margin-right:4px}
  textarea{width:100%;margin-top:6px;min-height:34px;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;font-family:inherit;font-size:14px;line-height:1.35;resize:vertical;background:#fff}
  .pie{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:8px 10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pie button{border:none;border-radius:8px;padding:10px 14px;font-size:14px;background:var(--acc);color:#fff}
  .pie button.sec{background:#fff;color:var(--tx);border:1px solid var(--ln)}
  .aviso{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .aviso.ver{opacity:1}
  .vacio{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>Revisión de actividades · Presupuestos rev1</h1>
  <div class="barra"><i id="prog"></i></div>
  <div class="resumen" id="resumen"></div>
  <div class="fila">
    <input type="search" id="buscar" placeholder="Buscar actividad, código o capítulo">
  </div>
  <div class="fila filtros" style="margin-top:7px">
    <button data-f="todas" class="on">Todas</button>
    <button data-f="pend">Sin aprobar</button>
    <button data-f="obs">Con observación</button>
    <button data-f="cab">Cabaña</button>
    <button data-f="viv">Vivienda</button>
  </div>
</header>
<main id="lista"></main>
<div class="pie">
  <button id="copiar">Copiar resultado para el chat</button>
  <button id="compartir" class="sec">Compartir</button>
</div>
<div class="aviso" id="aviso"></div>

try { estado = JSON.parse(localStorage.getItem(CLAVE) || "{}") || {}; } catch (e) { estado = {}; }
function guardar(){ try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {} }
function est(c){ return estado[c] || (estado[c] = {ok:false, obs:""}); }

let filtro = "todas", texto = "";
const abiertos = new Set();

function normal(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
function pasa(a){
  const e = estado[a.cod] || {};
  if (filtro==="pend" && e.ok) return false;
  if (filtro==="obs" && !(e.obs||"").trim()) return false;
  if (filtro==="cab" && a.aplica==="Vivienda") return false;
  if (filtro==="viv" && a.aplica==="Cabaña") return false;
  if (texto && !normal(a.cod+" "+a.act+" "+a.cap).includes(texto)) return false;
  return true;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function pintar(){
  const L = document.getElementById("lista");
  const caps = [];
  DATOS.forEach(a=>{ let c = caps.find(x=>x.n===a.cap); if(!c){c={n:a.cap,it:[]};caps.push(c);} c.it.push(a); });
  let html = "";
  caps.forEach(c=>{
    const vis = c.it.filter(pasa);
    if (!vis.length) return;
    const ok = c.it.filter(a=>(estado[a.cod]||{}).ok).length;
    const open = abiertos.has(c.n) || texto || filtro!=="todas";
    html += `<details data-cap="${esc(c.n)}" ${open?"open":""}><summary><span>${esc(c.n)}</span><span class="cnt ${ok===c.it.length?"lista":""}">${ok}/${c.it.length}</span></summary>`;
    html += `<div class="cap-acc"><button data-todo="${esc(c.n)}">Aprobar todo el capítulo</button></div>`;
    vis.forEach(a=>{
      const e = estado[a.cod] || {ok:false,obs:""};
      html += `<div class="item ${e.ok?"ok":""} ${(e.obs||"").trim()?"conobs":""}" data-c="${a.cod}">
        <label class="top"><input type="checkbox" ${e.ok?"checked":""} data-ok="${a.cod}">
        <span class="nom"><span class="cod">${a.cod}</span><b>${esc(a.act)}</b>
        <div class="meta">${esc(a.und)} · ${esc(a.aplica)} · ${esc(a.mo)} · sale de: ${esc(a.base)}</div></span></label>
        <textarea data-obs="${a.cod}" rows="1" placeholder="Observación">${esc(e.obs||"")}</textarea></div>`;
    });
    html += `</details>`;
  });
  L.innerHTML = html || `<div class="vacio">Nada que mostrar con este filtro.</div>`;
  resumen();
}
function resumen(){
  const tot = DATOS.length;
  const ok = DATOS.filter(a=>(estado[a.cod]||{}).ok).length;
  const obs = DATOS.filter(a=>((estado[a.cod]||{}).obs||"").trim()).length;
  document.getElementById("prog").style.width = (100*ok/tot)+"%";
  document.getElementById("resumen").textContent = `${ok} de ${tot} aprobadas · ${obs} con observación · ${tot-ok} sin aprobar`;
}
function aviso(t){ const a=document.getElementById("aviso"); a.textContent=t; a.classList.add("ver"); setTimeout(()=>a.classList.remove("ver"),1800); }

document.getElementById("lista").addEventListener("change", ev=>{
  const c = ev.target.dataset.ok;
  if (c){ est(c).ok = ev.target.checked; guardar(); ev.target.closest(".item").classList.toggle("ok", ev.target.checked);
    const d = ev.target.closest("details"); const cap = DATOS.filter(a=>a.cap===d.dataset.cap);
    const n = cap.filter(a=>(estado[a.cod]||{}).ok).length; const s=d.querySelector(".cnt"); s.textContent=`${n}/${cap.length}`; s.classList.toggle("lista", n===cap.length);
    resumen(); }
});
document.getElementById("lista").addEventListener("input", ev=>{
  const c = ev.target.dataset.obs;
  if (c){ est(c).obs = ev.target.value; guardar(); ev.target.closest(".item").classList.toggle("conobs", !!ev.target.value.trim());
    ev.target.style.height="auto"; ev.target.style.height=ev.target.scrollHeight+"px"; resumen(); }
});
document.getElementById("lista").addEventListener("click", ev=>{
  const cap = ev.target.dataset.todo;
  if (cap){ DATOS.filter(a=>a.cap===cap).forEach(a=>est(a.cod).ok=true); guardar(); abiertos.add(cap); pintar(); aviso("Capítulo aprobado"); }
});
document.getElementById("lista").addEventListener("toggle", ev=>{
  const d = ev.target; if (d.tagName!=="DETAILS") return;
  d.open ? abiertos.add(d.dataset.cap) : abiertos.delete(d.dataset.cap);
}, true);
document.getElementById("buscar").addEventListener("input", ev=>{ texto = normal(ev.target.value.trim()); pintar(); });
document.querySelectorAll(".filtros button").forEach(b=>b.addEventListener("click", ()=>{
  document.querySelectorAll(".filtros button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); filtro=b.dataset.f; pintar();
}));

function resultado(){
  const ok = DATOS.filter(a=>(estado[a.cod]||{}).ok);
  const no = DATOS.filter(a=>!(estado[a.cod]||{}).ok);
  let t = `Revisión actividades rev1: ${ok.length} de ${DATOS.length} aprobadas.\n`;
  const okObs = ok.filter(a=>(estado[a.cod].obs||"").trim());
  if (okObs.length){ t += `\nAprobadas con observación:\n`; okObs.forEach(a=>t+=`- ${a.cod} ${a.act}: ${estado[a.cod].obs.trim()}\n`); }
  if (no.length){ t += `\nSin aprobar:\n`; no.forEach(a=>{ const o=((estado[a.cod]||{}).obs||"").trim(); t+=`- ${a.cod} ${a.act}${o?": "+o:""}\n`; }); }
  return t;
}
async function copiarTexto(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.remove(); return ok;
}
document.getElementById("copiar").addEventListener("click", async ()=>{ aviso(await copiarTexto(resultado()) ? "Copiado. Pégalo en el chat." : "No se pudo copiar"); });
document.getElementById("compartir").addEventListener("click", async ()=>{
  const t = resultado();
  if (navigator.share){ try{ await navigator.share({title:"Revisión actividades rev1", text:t}); }catch(e){} }
  else { aviso(await copiarTexto(t) ? "Copiado. Pégalo en el chat." : "No se pudo copiar"); }
});
pintar();
</script>
</body>
</html>
